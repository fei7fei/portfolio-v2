<!doctype html>
<html lang="en">
<head>

<body class="is-ready is-work">

  <div class="app" data-tab="project">
    <aside class="side">
      <a class="mark reveal" style="--i:0" href="index.html#projects" aria-label="Michael Xie — home">

        <span class="mark__meta">copyright 2026<br>Vancouver, Canada</span>
      </a>

      <div class="menu reveal" style="--i:1">
        <p class="lbl">Menu</p>
        <nav class="tabs" aria-label="Sections">
          <a href="index.html#projects" data-nav="projects">Projects</a>
          <a href="index.html#experience" data-nav="experience">Experience</a>
          <a href="index.html#bio">About Me</a>

      <div class="panes reveal" style="--i:2">
        <!-- Filled by project-page.js from projects.js or experience.js -->
        <dl class="pane" data-facts></dl>
      </div>

      <div class="count reveal" style="--i:3">
        <p class="lbl" data-f="count-lbl">Net</p>
        <b class="count__big" data-f="no">00</b>
        <span class="count__of" data-f="of">/00</span>
      </div>
    </aside>

    <main class="stage stage--article">
      <article class="article" data-article></article>
    </main>
  </div>

  <script src="projects.js"></script>
  <script src="experience.js"></script>
  <script src="project-page.js"></script>
  <script src="contact.js"></script>
